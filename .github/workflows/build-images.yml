# Builds the three production images on GitHub (never on the 8 GB server) and pushes them to the GitHub
# container registry. Deploy by setting TAG in Portainer to the short commit id shown in the run summary
# (docs/DEPLOY-PORTAINER.md).
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image prefix and tag
        id: meta
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tohobil" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server is an Intel x86 machine, so linux/amd64 only.
      - name: API and web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Backup sidecar
        uses: docker/build-push-action@v6
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backup:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Database
        uses: docker/build-push-action@v6
        with:
          context: infra
          file: infra/Dockerfile.db
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-db:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-db:latest
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      - name: Show the tag to deploy
        run: echo "### Deploy tag: \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
