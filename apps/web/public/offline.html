<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a5c3a" />
    <title>বারাকাহ ফান্ড</title>
    <!-- Standalone page: shown by the Android shell when the server cannot be reached.
         No external requests; inline styles only (this file is not served under the API CSP). -->
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, sans-serif; font-size: 18px; line-height: 1.6; background: #fff; color: #1a1a1a; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      button { margin-top: 1rem; padding: 0.75rem 1.5rem; font-size: 1rem; border: 0; border-radius: 0.5rem;
               background: #1a5c3a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>বারাকাহ ফান্ড</h1>
      <p>ইন্টারনেট সংযোগ নেই। সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
      <p lang="en">No internet connection. Try again when you are back online.</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন / Retry</button>
    </main>
  </body>
</html>
