# Development database only. The API and web app run on the host with `pnpm dev`.
#   docker compose -f infra/docker-compose.dev.yml up -d db
services:
  db:
    image: postgres:16-alpine
    ports:
      # Loopback only: the dev database must not be reachable from the LAN.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: barakah
      POSTGRES_USER: barakah_migrator
      POSTGRES_PASSWORD: barakah_migrator
      APP_DB_PASSWORD: barakah_app
      READONLY_DB_PASSWORD: barakah_readonly
      TZ: UTC
    command: postgres -c timezone=UTC
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barakah_migrator -d barakah']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev: {}
